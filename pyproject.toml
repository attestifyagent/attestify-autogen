[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attestify-autogen"
version = "0.2.0"
description = "AutoGen tool integration for Attestify — governed AI loop execution, receipts, audit trails, and Attestify Trust (no-wallet agent identity + signed evidence)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["attestify", "autogen", "ai-agents", "receipts", "governance", "x402", "trust", "agent-identity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

dependencies = [
  "pyautogen>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest"]
trust = ["cryptography>=41.0.0"]

[project.urls]
Homepage = "https://attestifyos.com/trust"
Repository = "https://github.com/attestifyagent/attestify-autogen"
Documentation = "https://attestifyos.com/docs#trust"

[tool.hatch.build.targets.wheel]
packages = ["attestify_autogen"]
